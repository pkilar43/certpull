# /etc/certpull/hosts.d/<hostid>.conf
#
# The file name (without .conf) is the HOSTID. That is the same value that
# goes into the forced command in authorized_keys and into agent.conf on the
# LAN machine. Allowed characters: [a-z0-9._-]
#
# shellcheck shell=bash

# The first domain in the list becomes the CN and lego's file name.
# The rest go into the SAN. Wildcards work too (this is DNS-01).
DOMAINS="app.example.com www.app.example.com"

# ec256 | ec384 | rsa2048 | rsa4096   (empty = DEFAULT_KEY_TYPE)
KEY_TYPE=""

# Optional: a renewal threshold just for this host (empty = RENEW_DAYS)
RENEW_DAYS=""

# Set to "no" to disable renewal temporarily without deleting the file.
ENABLED="yes"

# The zone this host's _acme-challenge CNAME points into.
# Empty = ACME_ZONE from /etc/certpull/certpull.conf.
# Fill this in only when this client has its own delegation (certpull-zone add).
ACME_ZONE=""

# --- Which side holds the private key ---------------------------------------
# no  (default)  the server generates the private key, issues the certificate
#                and publishes key + certificate. The key exists in two places.
#
# yes            the AGENT generates its own private key, never sends it
#                anywhere, and submits a CSR instead. This server signs it and
#                publishes the certificate only. A certificate is then public
#                data: it is authentic because it chains to Let's Encrypt AND
#                matches a private key that never left the LAN machine.
#
# Switching an existing host from no to yes: set this, then run
# `certpull-agent --submit` on the LAN machine and `certpull-issue <hostid>`
# here. KEY_TYPE above stops applying -- the agent chooses its own key type.
# Requires an agent that knows the "submit" verb; an older agent fails closed
# with "privkey.pem is missing" rather than installing anything wrong.
CSR_MODE="no"
