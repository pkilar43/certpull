# /etc/certpull/agent.d/mail.conf
SERVER="certpull@ns-certpull.example.com"
SERVER_PORT="22"
SSH_KEY="/etc/certpull/id_ed25519"
KNOWN_HOSTS="/etc/certpull/known_hosts"

HOSTID="srv-web-01-mail"
DEST="/etc/ssl/certpull/mail"
CERT_OWNER="root:root"
CERT_MODE="0644"
KEY_OWNER="root:dovecot"
KEY_MODE="0640"
COMBINED="yes"
EXPECT_DOMAINS=""
RELOAD_CMD="systemctl reload postfix; systemctl reload dovecot"
