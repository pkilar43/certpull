# /etc/certpull/agent.d/web.conf
#
# Multi-profile mode: as soon as /etc/certpull/agent.d/ contains any *.conf,
# the agent ignores /etc/certpull/agent.conf and walks every profile instead.
# One profile = one certificate, with its own DEST and its own RELOAD_CMD.
#
# Shared by every profile on this host (the same SSH key!):
SERVER="certpull@ns-certpull.example.com"
SERVER_PORT="22"
SSH_KEY="/etc/certpull/id_ed25519"
KNOWN_HOSTS="/etc/certpull/known_hosts"

# Specific to this profile:
HOSTID="srv-web-01"
DEST="/etc/ssl/certpull/web"
CERT_OWNER="root:root"
CERT_MODE="0644"
KEY_OWNER="root:root"
KEY_MODE="0600"
COMBINED="no"
EXPECT_DOMAINS=""
RELOAD_CMD="apache2ctl configtest && systemctl reload apache2"
